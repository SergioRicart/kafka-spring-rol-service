asyncapi: "3.0.0"

info:
  title: Role Service
  version: "0.0.1"
  description: |
    Microservicio de gestión de roles. Publica eventos de dominio en Kafka
    con esquemas Avro serializados mediante Confluent Schema Registry.
  contact:
    name: Sergio Ricart
    url: https://github.com/SergioRicart/sergioricart-role_service

servers:
  local:
    host: localhost:9092
    protocol: kafka
    description: Broker Kafka local (desarrollo)
    bindings:
      kafka:
        schemaRegistryUrl: http://localhost:8081
        schemaRegistryVendor: confluent

channels:
  roleEvents:
    address: role.events
    description: Canal único para todos los eventos del dominio Role.
    bindings:
      kafka:
        topic: role.events
        partitions: 1
        replicas: 1
    messages:
      roleCreatedEvent:
        $ref: "#/components/messages/RoleCreatedEvent"
      roleUpdatedEvent:
        $ref: "#/components/messages/RoleUpdatedEvent"
      roleDeletedEvent:
        $ref: "#/components/messages/RoleDeletedEvent"

operations:
  publishRoleCreated:
    action: send
    channel:
      $ref: "#/channels/roleEvents"
    summary: Publica un evento cuando se crea un rol.
    messages:
      - $ref: "#/channels/roleEvents/messages/roleCreatedEvent"

  publishRoleUpdated:
    action: send
    channel:
      $ref: "#/channels/roleEvents"
    summary: Publica un evento cuando se actualiza un rol.
    messages:
      - $ref: "#/channels/roleEvents/messages/roleUpdatedEvent"

  publishRoleDeleted:
    action: send
    channel:
      $ref: "#/channels/roleEvents"
    summary: Publica un evento cuando se elimina un rol.
    messages:
      - $ref: "#/channels/roleEvents/messages/roleDeletedEvent"

components:
  messages:
    RoleCreatedEvent:
      name: RoleCreatedEvent
      title: Role Created
      summary: Se emite tras crear un nuevo rol.
      contentType: application/avro
      bindings:
        kafka:
          schemaIdLocation: header
          schemaLookupStrategy: TopicNameStrategy
      payload:
        $ref: "#/components/schemas/RoleCreatedEvent"

    RoleUpdatedEvent:
      name: RoleUpdatedEvent
      title: Role Updated
      summary: Se emite tras actualizar un rol existente.
      contentType: application/avro
      bindings:
        kafka:
          schemaIdLocation: header
          schemaLookupStrategy: TopicNameStrategy
      payload:
        $ref: "#/components/schemas/RoleUpdatedEvent"

    RoleDeletedEvent:
      name: RoleDeletedEvent
      title: Role Deleted
      summary: Se emite tras eliminar un rol.
      contentType: application/avro
      bindings:
        kafka:
          schemaIdLocation: header
          schemaLookupStrategy: TopicNameStrategy
      payload:
        $ref: "#/components/schemas/RoleDeletedEvent"

  schemas:
    Page:
      type: object
      description: Página de navegación asociada a un rol.
      required:
        - id
        - name
        - description
        - url
      properties:
        id:
          type: string
          description: Identificador único de la página.
        name:
          type: string
          description: Nombre de la página.
        description:
          type: string
          description: Descripción de la página.
        url:
          type: string
          description: Ruta o URL de la página.

    RoleCreatedEvent:
      type: object
      description: |
        Evento publicado cuando se crea un rol.
        Avro namespace: com.sergioricart.role_service.autogenerated.events.role
      required:
        - id
        - name
        - description
        - pages
        - createdAt
      properties:
        id:
          type: string
          description: Identificador único del rol.
        name:
          type: string
          description: Nombre del rol.
        description:
          type: string
          description: Descripción del rol.
        pages:
          type: array
          items:
            $ref: "#/components/schemas/Page"
          description: Páginas asignadas al rol en el momento de su creación.
        createdAt:
          type: integer
          format: int64
          description: Timestamp de creación en milisegundos (Avro timestamp-millis).

    RoleUpdatedEvent:
      type: object
      description: |
        Evento publicado cuando se actualiza un rol.
        Avro namespace: com.sergioricart.role_service.autogenerated.events.role
      required:
        - id
        - name
        - description
        - pages
        - updatedAt
      properties:
        id:
          type: string
          description: Identificador único del rol.
        name:
          type: string
          description: Nuevo nombre del rol.
        description:
          type: string
          description: Nueva descripción del rol.
        pages:
          type: array
          items:
            $ref: "#/components/schemas/Page"
          description: Lista actualizada de páginas asignadas al rol.
        updatedAt:
          type: integer
          format: int64
          description: Timestamp de actualización en milisegundos (Avro timestamp-millis).

    RoleDeletedEvent:
      type: object
      description: |
        Evento publicado cuando se elimina un rol.
        Avro namespace: com.sergioricart.role_service.autogenerated.events.role
      required:
        - id
        - deletedAt
      properties:
        id:
          type: string
          description: Identificador único del rol eliminado.
        deletedAt:
          type: integer
          format: int64
          description: Timestamp de eliminación en milisegundos (Avro timestamp-millis).